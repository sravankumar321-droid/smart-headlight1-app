<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SmartBeam — Adaptive Headlight Control</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08090d;
    --panel: #0e1018;
    --border: #1e2235;
    --accent: #00d4ff;
    --accent2: #ff6b2b;
    --warn: #ffcc00;
    --text: #c8d0e8;
    --text-dim: #4a5270;
    --glow: rgba(0, 212, 255, 0.18);
    --glow2: rgba(255, 107, 43, 0.18);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    overflow-x: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 400px;
    background: radial-gradient(ellipse at center, rgba(0,212,255,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 780px;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 40px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .logo-label {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0.7;
  }

  .logo-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 30px var(--accent);
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 100px;
  }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 8px #2ecc71;
    animation: pulse 2s infinite;
  }

  /* Headlight visualizer */
  .visualizer {
    position: relative;
    width: 100%;
    height: 200px;
    margin-bottom: 32px;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: #050609;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .road {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 60px;
    background: linear-gradient(to top, #131520 0%, transparent 100%);
  }

  .road-line {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px; height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 4px;
  }

  .beam {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 280px solid transparent;
    border-right: 280px solid transparent;
    border-bottom: 160px solid rgba(0,212,255,0.06);
    transition: border-bottom-color 0.4s ease, filter 0.4s ease;
    filter: blur(2px);
  }

  .beam-core {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 120px solid transparent;
    border-right: 120px solid transparent;
    border-bottom: 120px solid rgba(0,212,255,0.09);
    transition: border-bottom-color 0.4s ease;
    filter: blur(1px);
  }

  .headlight-source {
    position: absolute;
    bottom: 58px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 80px;
  }

  .headlight-dot {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 14px 4px rgba(0,212,255,0.7), 0 0 40px rgba(0,212,255,0.3);
    transition: box-shadow 0.4s ease, background 0.4s ease;
  }

  .beam-label {
    position: absolute;
    top: 14px; right: 18px;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  /* Grid layout */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
    animation: fadeUp 0.6s 0.2s ease both;
  }

  .grid-full {
    grid-column: 1 / -1;
  }

  /* Panels */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s ease;
  }

  .panel:hover { border-color: rgba(0,212,255,0.25); }

  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.3;
  }

  .panel-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  /* Brightness Slider */
  .brightness-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 20px var(--glow);
    line-height: 1;
    margin-bottom: 18px;
    transition: text-shadow 0.3s;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    outline: none;
    margin-bottom: 8px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:active {
    transform: scale(1.3);
    box-shadow: 0 0 20px var(--accent);
  }

  .slider-track-labels {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* Mode Buttons */
  .mode-display {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 18px;
    min-height: 28px;
  }

  .mode-display span {
    color: var(--accent);
    text-shadow: 0 0 14px var(--glow);
  }

  .mode-buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .btn-mode {
    padding: 10px 8px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .btn-mode:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
    box-shadow: 0 0 12px rgba(0,212,255,0.08);
  }

  .btn-mode.active {
    border-color: var(--accent);
    color: #fff;
    background: rgba(0,212,255,0.12);
    box-shadow: 0 0 16px rgba(0,212,255,0.15);
  }

  /* Sensor Panel */
  .lux-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: var(--warn);
    text-shadow: 0 0 20px rgba(255,204,0,0.3);
    line-height: 1;
    margin-bottom: 6px;
    transition: color 0.4s ease;
  }

  .lux-unit {
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 18px;
  }

  .lux-bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .lux-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #2ecc71, var(--warn), var(--accent2));
    width: 0%;
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .lux-condition {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .btn-sensor {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--accent2);
    border-radius: 8px;
    color: var(--accent2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-sensor:hover {
    background: rgba(255,107,43,0.1);
    box-shadow: 0 0 16px rgba(255,107,43,0.15);
  }

  .btn-sensor:active { transform: scale(0.98); }

  /* Log Panel */
  .log-panel {
    animation: fadeUp 0.6s 0.35s ease both;
  }

  .log-scroll {
    height: 110px;
    overflow-y: auto;
    display: flex;
    flex-direction: column-reverse;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .log-entry {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
    display: flex;
    gap: 12px;
    animation: logIn 0.25s ease both;
  }

  .log-entry .log-time { color: var(--accent); opacity: 0.5; flex-shrink: 0; }
  .log-entry .log-msg { color: var(--text); }
  .log-entry.log-warn .log-msg { color: var(--warn); }
  .log-entry.log-info .log-msg { color: var(--accent); }

  /* Footer */
  footer {
    margin-top: 32px;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    opacity: 0.4;
    text-align: center;
    animation: fadeUp 0.6s 0.4s ease both;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px #2ecc71; }
    50% { opacity: 0.5; box-shadow: 0 0 3px #2ecc71; }
  }

  @keyframes logIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .logo-title { font-size: 22px; }
    .brightness-value { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo">
      <span class="logo-label">Adaptive System</span>
      <span class="logo-title">SmartBeam</span>
    </div>
    <div class="status-pill">
      <span class="status-dot"></span>
      System Online
    </div>
  </header>

  <!-- Visualizer -->
  <div class="visualizer" id="visualizer">
    <div class="beam" id="beamOuter"></div>
    <div class="beam-core" id="beamCore"></div>
    <div class="headlight-source">
      <div class="headlight-dot" id="dotL"></div>
      <div class="headlight-dot" id="dotR"></div>
    </div>
    <div class="road">
      <div class="road-line"></div>
    </div>
    <span class="beam-label">BEAM PROJECTION</span>
  </div>

  <!-- Main Grid -->
  <div class="grid">

    <!-- Brightness -->
    <div class="panel">
      <div class="panel-label">Brightness Control</div>
      <div class="brightness-value" id="brightnessValue">75%</div>
      <input type="range" id="brightness" min="0" max="100" value="75" />
      <div class="slider-track-labels"><span>OFF</span><span>MAX</span></div>
    </div>

    <!-- Mode -->
    <div class="panel">
      <div class="panel-label">Lighting Mode</div>
      <div class="mode-display">Mode: <span id="modeLabel">Auto</span></div>
      <div class="mode-buttons">
        <button class="btn-mode active" onclick="setMode('Auto')" data-mode="Auto">⬡ Auto</button>
        <button class="btn-mode" onclick="setMode('High Beam')" data-mode="High Beam">◈ High</button>
        <button class="btn-mode" onclick="setMode('Low Beam')" data-mode="Low Beam">◇ Low</button>
        <button class="btn-mode" onclick="setMode('Fog')" data-mode="Fog">≋ Fog</button>
      </div>
    </div>

    <!-- Sensor -->
    <div class="panel">
      <div class="panel-label">Ambient Light Sensor</div>
      <div class="lux-value" id="lux">—</div>
      <div class="lux-unit">lux</div>
      <div class="lux-bar-track">
        <div class="lux-bar-fill" id="luxBar"></div>
      </div>
      <div class="lux-condition" id="luxCondition">awaiting reading…</div>
      <button class="btn-sensor" onclick="simulateSensor()">▷ Sample Sensor</button>
    </div>

    <!-- Log -->
    <div class="panel log-panel">
      <div class="panel-label">Event Log</div>
      <div class="log-scroll" id="logScroll"></div>
    </div>

  </div>

  <footer>SmartBeam v1.0 — Adaptive Headlight Control System</footer>
</div>

<script>
  // ── State ────────────────────────────────────────────
  let currentBrightness = 75;
  let currentMode = 'Auto';
  let currentLux = null;

  // ── Elements ─────────────────────────────────────────
  const brightness    = document.getElementById("brightness");
  const brightnessVal = document.getElementById("brightnessValue");
  const modeLabel     = document.getElementById("modeLabel");
  const luxEl         = document.getElementById("lux");
  const luxBar        = document.getElementById("luxBar");
  const luxCondition  = document.getElementById("luxCondition");
  const beamOuter     = document.getElementById("beamOuter");
  const beamCore      = document.getElementById("beamCore");
  const dotL          = document.getElementById("dotL");
  const dotR          = document.getElementById("dotR");
  const logScroll     = document.getElementById("logScroll");

  // ── Brightness ───────────────────────────────────────
  brightness.oninput = function () {
    currentBrightness = +this.value;
    brightnessVal.innerText = currentBrightness + "%";
    updateBeam();
    addLog(`Brightness set to ${currentBrightness}%`);
  };

  // ── Mode ─────────────────────────────────────────────
  function setMode(mode) {
    currentMode = mode;
    modeLabel.innerText = mode;

    document.querySelectorAll(".btn-mode").forEach(b => {
      b.classList.toggle("active", b.dataset.mode === mode);
    });

    updateBeam();
    addLog(`Mode switched to ${mode}`, "info");
  }

  // ── Sensor ───────────────────────────────────────────
  function simulateSensor() {
    currentLux = Math.floor(Math.random() * 1000);
    luxEl.innerText = currentLux.toLocaleString();

    const pct = Math.min(currentLux / 1000, 1) * 100;
    luxBar.style.width = pct + "%";

    let condition, type = "";
    if (currentLux < 50)        { condition = "Night / Dark";     type = "warn"; }
    else if (currentLux < 200)  { condition = "Dusk / Dawn"; }
    else if (currentLux < 600)  { condition = "Overcast / Cloudy"; }
    else                        { condition = "Bright Daylight"; }

    luxCondition.innerText = condition;
    addLog(`Sensor: ${currentLux} lux — ${condition}`, type);

    // Auto-suggest brightness
    if (currentMode === 'Auto') {
      const suggested = Math.max(10, Math.round((1 - currentLux / 1000) * 100));
      brightness.value = suggested;
      currentBrightness = suggested;
      brightnessVal.innerText = suggested + "%";
      updateBeam();
      addLog(`Auto-adjusted brightness to ${suggested}%`, "info");
    }
  }

  // ── Beam Visualizer ──────────────────────────────────
  function updateBeam() {
    const pct = currentBrightness / 100;
    const modeMap = { Auto: 1.0, 'High Beam': 1.3, 'Low Beam': 0.6, Fog: 0.35 };
    const intensity = pct * (modeMap[currentMode] || 1.0);

    const outerAlpha  = Math.min(intensity * 0.22, 0.22);
    const coreAlpha   = Math.min(intensity * 0.28, 0.28);
    const dotGlow     = Math.round(intensity * 30);
    const dotColor    = currentMode === 'Fog'
      ? `rgba(255,220,100,${0.6 + intensity * 0.4})`
      : `rgba(200,230,255,${0.7 + intensity * 0.3})`;
    const glowColor   = currentMode === 'Fog' ? '255,190,40' : '0,212,255';

    beamOuter.style.borderBottomColor = `rgba(${glowColor},${outerAlpha})`;
    beamCore.style.borderBottomColor  = `rgba(${glowColor},${coreAlpha})`;
    beamOuter.style.filter = `blur(${2 + intensity * 4}px)`;

    [dotL, dotR].forEach(d => {
      d.style.background = dotColor;
      d.style.boxShadow  = `0 0 ${dotGlow}px ${Math.round(dotGlow/2)}px rgba(${glowColor},0.7), 0 0 ${dotGlow*2}px rgba(${glowColor},0.2)`;
    });
  }

  // ── Event Log ────────────────────────────────────────
  function addLog(msg, type = "") {
    const now  = new Date();
    const time = now.toTimeString().slice(0,8);
    const entry = document.createElement("div");
    entry.className = `log-entry ${type ? "log-" + type : ""}`;
    entry.innerHTML = `<span class="log-time">${time}</span><span class="log-msg">${msg}</span>`;
    logScroll.prepend(entry);
    // Trim log to 40 entries
    while (logScroll.children.length > 40) logScroll.removeChild(logScroll.lastChild);
  }

  // ── Init ─────────────────────────────────────────────
  updateBeam();
  addLog("SmartBeam system initialized", "info");
  addLog("Mode: Auto | Brightness: 75%");
</script>
</body>
</html>
